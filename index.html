<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mark — Three.js reconstruction</title>
<style>
  :root { color-scheme: dark; }
  /* page is transparent by default so the object can be embedded over anything */
  html,body { margin:0; height:100%; overflow:hidden; background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  /* optional preview backdrops (never exported in embed mode) */
  body.bg-dark   { background:#12131a; }
  body.bg-check  {
    background-color:#d9dbe2;
    background-image:
      linear-gradient(45deg,#b7bac6 25%,transparent 25%),
      linear-gradient(-45deg,#b7bac6 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#b7bac6 75%),
      linear-gradient(-45deg,transparent 75%,#b7bac6 75%);
    background-size:32px 32px; background-position:0 0,0 16px,16px -16px,-16px 0px;
  }
  #hud { position:fixed; left:16px; top:14px; color:#aeb4c6; font-size:12px; line-height:1.55;
    user-select:none; pointer-events:none; letter-spacing:.2px; text-shadow:0 1px 3px #000a; }
  #hud b { color:#fff; font-weight:600; }
  #panel { position:fixed; right:14px; top:14px; display:flex; gap:8px; flex-wrap:wrap;
    justify-content:flex-end; max-width:300px; }
  button { background:#1b1c24cc; backdrop-filter:blur(6px); color:#cfd3e0; border:1px solid #3a3d4b;
    padding:7px 12px; border-radius:9px; font-size:12px; cursor:pointer; transition:.15s; font-weight:500; }
  button:hover { background:#262836cc; border-color:#5b6072; color:#fff; }
  button.on { background:#3550c8; border-color:#4a67e6; color:#fff; }
  #dock { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:16px;
    align-items:center; background:#14151cd0; backdrop-filter:blur(8px); border:1px solid #2b2d38;
    border-radius:13px; padding:9px 16px; box-shadow:0 8px 30px #0007; }
  #dock label { font-size:11px; color:#9a9fb0; display:flex; gap:7px; align-items:center; }
  input[type=range]{ accent-color:#4a67e6; width:100px; }
  #toast { position:fixed; left:50%; bottom:74px; transform:translateX(-50%) translateY(10px);
    background:#0f1420ee; border:1px solid #2e3550; color:#dfe4f2; font-size:12px; padding:10px 14px;
    border-radius:10px; max-width:min(560px,86vw); opacity:0; pointer-events:none; transition:.25s;
    white-space:pre-wrap; box-shadow:0 10px 40px #000a; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast code{ color:#8fd0ff; }
  body.embed #hud, body.embed #panel, body.embed #dock { display:none !important; }
  .spinner{position:fixed;inset:0;display:grid;place-items:center;color:#8a90a0;font-size:13px}
</style>

<div id="app"></div>
<div class="spinner" id="load">loading three.js…</div>
<div id="hud"><b>Mark</b> — Three.js reconstruction<br />drag rotate · right-drag / two-finger pan · scroll zoom</div>
<div id="panel">
  <button id="spin" class="on">Auto-spin</button>
  <button id="front">Front</button>
  <button id="tq">3/4</button>
  <button id="edge">Edge</button>
  <button id="bg">Backdrop</button>
  <button id="embed">⧉ Embed</button>
</div>
<div id="dock">
  <label>Depth <input id="depth" type="range" min="10" max="90" value="42" step="2" /></label>
  <label>Polish <input id="polish" type="range" min="0" max="1" value="0.7" step="0.02" /></label>
  <label>Spin <input id="spd" type="range" min="0" max="2.5" value="1" step="0.05" /></label>
</div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---- exact source vector (ATDark.svg, single black path) ---- */
const SVG = `<svg viewBox="0 0 498 502" xmlns="http://www.w3.org/2000/svg"><path d="M477.788 0.000107405L20.0789 0.0249176C9.0385 0.0255161 0.086897 8.97197 0.079946 20.0123L0.000147581 146.758C-0.00680941 157.808 8.94849 166.77 19.9984 166.771L134.112 166.78C148.793 166.782 158.454 182.065 152.042 195.272C117.364 266.693 79.9459 337.959 45.4625 409.312C35.6241 429.669 23.7723 452.005 13.0732 473.554C6.63163 486.528 16.1881 501.393 30.6732 501.394L150.15 501.401C157.747 501.402 164.689 497.098 168.062 490.29C188.871 448.298 209.806 405.759 231.007 363.8C238.375 349.218 259.144 349.276 266.514 363.857L330.413 490.275C333.76 496.897 340.487 501.127 347.907 501.218C384.009 501.658 428.874 501.51 466.81 501.439C481.327 501.412 491.011 486.427 485.061 473.187L360.026 194.967C354.078 181.732 363.761 166.766 378.271 166.768L477.809 166.782C488.857 166.784 497.814 157.827 497.812 146.779L497.789 19.9965C497.787 8.9518 488.833 -0.000491275 477.788 0.000107405Z" fill="black"/></svg>`;

const CX = 248.9, CY = 250.7;               // bbox center in SVG space
const isEmbed = /embed/i.test(location.hash);

/* ---------------- renderer / scene (transparent, NO shadows) ---------------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);          // fully transparent background
renderer.shadowMap.enabled=false;            // no shadows anywhere
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();               // background stays null → transparent
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.03).texture;

const camera=new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 1, 4000);
const HOME=new THREE.Vector3(0,0,760); camera.position.copy(HOME);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.07;
controls.enablePan=true; controls.screenSpacePanning=true;
controls.rotateSpeed=0.9; controls.zoomSpeed=0.9; controls.panSpeed=0.8;
controls.minDistance=380; controls.maxDistance=1400;

/* lights (none cast shadows) — key + rim to reveal the bevels on glossy black */
const key=new THREE.DirectionalLight(0xffffff,2.1); key.position.set(-160,220,340); scene.add(key);
const rim=new THREE.DirectionalLight(0xbcd0ff,1.3); rim.position.set(260,-120,-160); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(120,60,260); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,0.15));

/* ---------------- parse + build ---------------- */
const parsed=new SVGLoader().parse(SVG);
let markShape=null, best=-1;
for(const p of parsed.paths){ for(const s of SVGLoader.createShapes(p)){
  const b=new THREE.Box3(); s.getPoints(20).forEach(q=>b.expandByPoint(new THREE.Vector3(q.x,q.y,0)));
  const sz=b.getSize(new THREE.Vector3()), a=sz.x*sz.y; if(a>best){best=a; markShape=s;}
}}

const group=new THREE.Group(); group.scale.y=-1; scene.add(group);   // flip SVG y-down
let mat;
function build(depth){
  while(group.children.length){ const m=group.children.pop(); m.geometry?.dispose(); }
  const bevel=Math.min(9, depth*0.28);
  const geo=new THREE.ExtrudeGeometry(markShape,{depth,bevelEnabled:true,
    bevelThickness:bevel,bevelSize:bevel,bevelSegments:5,curveSegments:64});
  geo.translate(-CX,-CY,-depth/2);
  geo.computeVertexNormals();
  mat=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color('#E0E0E0'),          // logo colour
    metalness:0.25, roughness:0.5-parseFloat(polishEl.value)*0.34,
    clearcoat:0.7, clearcoatRoughness:0.18,
    envMapIntensity:0.7, side:THREE.DoubleSide,
  });
  const mesh=new THREE.Mesh(geo,mat); group.add(mesh);
}

/* ---------------- UI ---------------- */
const depthEl=document.getElementById('depth'),
      polishEl=document.getElementById('polish'),
      spdEl=document.getElementById('spd');
build(parseFloat(depthEl.value));
document.getElementById('load').remove();

depthEl.oninput=()=>{ const ry=group.rotation.y; build(parseFloat(depthEl.value)); group.rotation.y=ry; };
polishEl.oninput=()=>{ if(mat){ mat.roughness=0.5-parseFloat(polishEl.value)*0.34; mat.needsUpdate=true; } };

let spinning=true, spinSpeed=parseFloat(spdEl.value);
const bSpin=document.getElementById('spin');
bSpin.onclick=()=>{ spinning=!spinning; bSpin.classList.toggle('on',spinning); };
spdEl.oninput=()=>{ spinSpeed=parseFloat(spdEl.value); };

function flyTo(pos){ spinning=false; bSpin.classList.remove('on');
  const from=camera.position.clone(), to=new THREE.Vector3(...pos), t0=performance.now(), dur=700;
  (function s(){ const k=Math.min(1,(performance.now()-t0)/dur);
    const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(from,to,e); controls.target.set(0,0,0);
    if(k<1) requestAnimationFrame(s); })();
}
document.getElementById('front').onclick=()=>{ group.rotation.set(0,0,0); flyTo([0,0,760]); };
document.getElementById('tq').onclick   =()=>{ flyTo([420,240,560]); };
document.getElementById('edge').onclick =()=>{ group.rotation.set(0,0,0); flyTo([700,60,150]); };

/* backdrop cycler — preview only, does NOT affect the transparent export */
const bgModes=['transparent','check','dark']; let bgi=0;
document.getElementById('bg').onclick=()=>{ bgi=(bgi+1)%bgModes.length;
  document.body.classList.remove('bg-check','bg-dark');
  if(bgModes[bgi]==='check') document.body.classList.add('bg-check');
  if(bgModes[bgi]==='dark')  document.body.classList.add('bg-dark');
  toast(`Preview backdrop: ${bgModes[bgi]}  ·  the actual render stays transparent`);
};

/* ---- Embed: copy an iframe snippet + explain hosting; also link the #embed clean view ---- */
function toast(msg,ms=5200){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
document.getElementById('embed').onclick=()=>{
  const file='ATDark3D.html';
  const snippet=`<iframe src="${file}#embed" width="480" height="480" `+
    `style="border:0;background:transparent" loading="lazy" title="Logo mark"></iframe>`;
  const copy=navigator.clipboard?.writeText(snippet);
  const done=()=>toast(
    `Embed code copied ✔\n${snippet}\n\n`+
    `1) Save this file as "${file}" and host it (or drop it beside your page).\n`+
    `2) Paste the tag above. The "#embed" view hides all UI and keeps the\n`+
    `   background transparent, so the spinning mark floats over your page.`);
  if(copy&&copy.then){ copy.then(done).catch(()=>{ prompt('Copy this embed code:',snippet); }); }
  else { prompt('Copy this embed code:',snippet); }
};

/* clean embed view when opened with #embed */
if(isEmbed){ document.body.classList.add('embed'); spinning=true; }

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

renderer.setAnimationLoop(()=>{ if(spinning) group.rotation.y+=0.006*spinSpeed; controls.update(); renderer.render(scene,camera); });
</script>
